<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>블록월드 어드벤처</title>
<style>
  :root{
    --ink:#2b2140;
    --panel:rgba(255,255,255,.86);
    --shadow:0 6px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.18);
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#87ceeb;}
  body{
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Nanum Gothic',system-ui,sans-serif;
    font-weight:800; color:var(--ink); user-select:none; touch-action:none;
  }
  canvas{display:block; width:100%; height:100%;}

  /* ---------- 화면 위에 겹쳐지는 UI ---------- */
  #ui{position:fixed; inset:0; pointer-events:none; z-index:10;}
  .card{
    background:var(--panel); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:10px 14px;
    backdrop-filter:blur(3px);
  }

  /* 조준점 */
  #crosshair{
    position:fixed; left:50%; top:50%; width:26px; height:26px;
    margin:-13px 0 0 -13px; pointer-events:none; opacity:.9; z-index:11;
    transition:transform .08s ease;
  }
  #crosshair:before,#crosshair:after{
    content:''; position:absolute; background:#fff; border-radius:3px;
    box-shadow:0 0 0 2px rgba(0,0,0,.35);
  }
  #crosshair:before{left:11px; top:2px; width:4px; height:22px;}
  #crosshair:after{top:11px; left:2px; height:4px; width:22px;}
  body.nolock #crosshair{opacity:0;}

  /* 시작 화면 */
  #start{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    background:radial-gradient(circle at 50% 30%, #9fe0ff 0%, #5bb6f0 55%, #2e86c8 100%);
    pointer-events:auto;
  }
  #start h1{
    font-size:clamp(34px,8vw,72px); margin:0; color:#fff; letter-spacing:2px;
    text-shadow:0 5px 0 #2a6ea8, 0 10px 22px rgba(0,0,0,.3);
    animation:bob 2.2s ease-in-out infinite;
  }
  #start .sub{font-size:clamp(15px,3.4vw,22px); color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.35);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bigbtn{
    pointer-events:auto; cursor:pointer; border:none; border-radius:999px;
    font-family:inherit; font-weight:900; font-size:clamp(20px,4.5vw,30px);
    color:#fff; padding:16px 44px; background:linear-gradient(#ffcf3f,#ff9f1a);
    box-shadow:0 7px 0 #c9700a, 0 14px 26px rgba(0,0,0,.28);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .bigbtn:hover{transform:translateY(-3px); box-shadow:0 10px 0 #c9700a, 0 18px 30px rgba(0,0,0,.3);}
  .bigbtn:active{transform:translateY(4px); box-shadow:0 3px 0 #c9700a;}
  #start .keys{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px;
    font-size:clamp(13px,3vw,17px);
  }
  #start .keys span{background:rgba(255,255,255,.9); padding:8px 14px; border-radius:12px; box-shadow:0 3px 0 rgba(0,0,0,.15);}

  /* 잠깐 멈춤(포인터 잠금 해제) 안내 */
  #resume{
    position:fixed; left:50%; top:16px; transform:translateX(-50%);
    z-index:35; display:none; pointer-events:none;
  }
  #resume .card{font-size:15px; padding:8px 16px; text-align:center; opacity:.92;}

  /* 상단 좌측: 코인 + 레벨 */
  #hud-left{position:fixed; left:14px; top:14px; display:flex; flex-direction:column; gap:8px;}
  #coinbox{display:flex; align-items:center; gap:8px; font-size:22px;}
  .coinicon{
    width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6b0, #ffc82e 60%, #d99400);
    box-shadow:0 2px 0 #a86f00, inset 0 0 0 2px rgba(255,255,255,.45);
  }
  #lvlbox{min-width:180px;}
  #lvlrow{display:flex; justify-content:space-between; font-size:15px; margin-bottom:5px;}
  #expbar{height:12px; background:#e5e0ef; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.18);}
  #expfill{height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#7ae582,#38d39f); transition:width .3s ease;}

  /* 힌트 */
  #hint{
    position:fixed; left:50%; bottom:118px; transform:translateX(-50%);
    font-size:17px; white-space:nowrap; opacity:0; transition:opacity .3s ease;
  }
  #hint.on{opacity:1;}

  /* 화면에 뜨는 +숫자 */
  #pops{position:fixed; inset:0; overflow:hidden;}
  .pop{
    position:absolute; font-size:26px; color:#fff; font-weight:900;
    text-shadow:0 3px 0 rgba(0,0,0,.35); animation:popup 1s ease-out forwards;
  }
  @keyframes popup{
    0%{transform:translate(-50%,0) scale(.5); opacity:0;}
    25%{transform:translate(-50%,-18px) scale(1.25); opacity:1;}
    100%{transform:translate(-50%,-70px) scale(1); opacity:0;}
  }

  #fps{position:fixed; right:14px; bottom:12px; font-size:13px; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.5); opacity:.75;}

  /* 하단 블록 선택 바 */
  #hotbar{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; gap:8px; pointer-events:auto; padding:8px 10px;
  }
  .slot{
    width:60px; height:66px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,.82); box-shadow:0 4px 0 rgba(0,0,0,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    position:relative;
  }
  .slot .ic{font-size:26px; line-height:1;}
  .slot .nm{font-size:11px; opacity:.8;}
  .slot .num{
    position:absolute; top:3px; left:6px; font-size:11px; opacity:.55;
  }
  .slot:hover{transform:translateY(-4px);}
  .slot.sel{
    background:#fff; transform:translateY(-10px) scale(1.1);
    box-shadow:0 8px 0 #ffab2e, 0 0 0 4px #ffd93d, 0 12px 22px rgba(0,0,0,.25);
  }
  .slot.lock{filter:grayscale(1); opacity:.5; cursor:not-allowed;}
  .slot.lock:after{
    content:'🔒'; position:absolute; right:4px; top:3px; font-size:13px; filter:none;
  }
  .slot.lock .nm{font-size:10px;}

  /* 큰 축하 배너 */
  #banner{
    position:fixed; left:50%; top:26%; transform:translate(-50%,-50%) scale(.4);
    opacity:0; pointer-events:none; text-align:center; z-index:20;
    font-size:clamp(28px,6vw,52px); color:#fff;
    text-shadow:0 5px 0 rgba(0,0,0,.28), 0 10px 26px rgba(0,0,0,.35);
  }
  #banner.show{animation:bannerPop 2.4s ease-out forwards;}
  @keyframes bannerPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-6deg);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(2deg);}
    30%{transform:translate(-50%,-50%) scale(1) rotate(0);}
    80%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-80%) scale(.95);}
  }
  #banner .small{display:block; font-size:.5em; margin-top:8px; opacity:.95;}

  /* 우상단 퀘스트 */
  #quests{position:fixed; right:14px; top:14px; width:224px;}
  #qtitle{font-size:15px; margin-bottom:7px; opacity:.85;}
  .quest{
    display:flex; gap:8px; align-items:flex-start; padding:6px 0;
    border-top:2px dotted rgba(0,0,0,.10);
  }
  .quest:first-child{border-top:none;}
  .quest .qic{font-size:19px; line-height:1.15;}
  .quest .qbody{flex:1; min-width:0;}
  .quest .qtx{font-size:13px; line-height:1.3;}
  .quest .qbar{height:7px; background:#e8e3f0; border-radius:99px; margin-top:4px; overflow:hidden;}
  .quest .qfill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#ffd93d,#ff9f1a); transition:width .35s ease;}
  .quest .qnum{font-size:11px; opacity:.6; margin-top:2px;}
  .quest.done{animation:questDone .9s ease-out;}
  .quest.done .qtx{text-decoration:line-through; opacity:.55;}
  .quest.done .qfill{background:linear-gradient(90deg,#7ae582,#38d39f);}
  @keyframes questDone{
    0%{transform:scale(1);} 30%{transform:scale(1.09); background:rgba(122,229,130,.35);}
    100%{transform:scale(1); background:transparent;}
  }

  /* 콤보 */
  #combo{
    position:fixed; left:50%; top:16%; transform:translateX(-50%) scale(.6);
    font-size:clamp(22px,5vw,40px); color:#fff; opacity:0; pointer-events:none; z-index:19;
    text-shadow:0 4px 0 #e0590b, 0 8px 20px rgba(0,0,0,.35);
  }
  #combo.on{animation:comboPop .8s ease-out;}
  @keyframes comboPop{
    0%{opacity:0; transform:translateX(-50%) scale(.5) rotate(-8deg);}
    35%{opacity:1; transform:translateX(-50%) scale(1.2) rotate(4deg);}
    100%{opacity:0; transform:translateX(-50%) scale(1) rotate(0);}
  }

  /* 레벨업 — 화면 가득 */
  #levelfx{
    position:fixed; inset:0; z-index:30; pointer-events:none; display:none; overflow:hidden;
  }
  #levelfx .flash{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95) 0%, rgba(255,214,90,.6) 30%, rgba(255,214,90,0) 65%);
    animation:flash 1.5s ease-out forwards;
  }
  @keyframes flash{0%{opacity:0; transform:scale(.3);}20%{opacity:1;}100%{opacity:0; transform:scale(1.7);}}
  #levelfx .lvtext{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    font-size:clamp(38px,9vw,88px); color:#fff; text-align:center; white-space:nowrap;
    text-shadow:0 6px 0 #e08a00, 0 14px 30px rgba(0,0,0,.4);
    animation:lvup 2.6s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  #levelfx .lvsub{display:block; font-size:.34em; margin-top:10px; text-shadow:0 3px 0 #b36b00;}
  @keyframes lvup{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-12deg);}
    22%{opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(3deg);}
    35%{transform:translate(-50%,-50%) scale(1) rotate(0);}
    82%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-60%) scale(1.05);}
  }
  .confetti{
    position:absolute; width:12px; height:16px; border-radius:3px; top:-24px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(112vh) rotate(720deg); opacity:.9;}
  }

  #err{
    position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center;
    background:#2b2140; color:#fff; text-align:center; padding:30px; font-size:20px; line-height:1.7;
  }
</style>
</head>
<body class="nolock">

<canvas id="c"></canvas>

<div id="crosshair"></div>

<div id="ui">
  <div id="hud-left">
    <div class="card" id="coinbox"><div class="coinicon"></div><span id="coins">0</span></div>
    <div class="card" id="lvlbox">
      <div id="lvlrow"><span>레벨 <b id="lvl">1</b></span><span id="exptext">0 / 100</span></div>
      <div id="expbar"><div id="expfill"></div></div>
    </div>
  </div>
  <div class="card" id="hint"></div>
  <div id="pops"></div>
  <div class="card" id="quests">
    <div id="qtitle">📋 퀘스트</div>
    <div id="qlist"></div>
  </div>
  <div id="hotbar"></div>
  <div id="combo"></div>
  <div id="banner"></div>
  <div id="fps"></div>
</div>

<div id="resume"><div class="card">🖱️ 마우스로 둘러보려면 화면을 클릭 · 키보드만 쓸 거면 그냥 하세요</div></div>

<div id="start">
  <h1>🧱 블록월드 어드벤처</h1>
  <div class="sub">블록을 쌓고, 뛰어놀고, 코인을 모으자!</div>
  <button class="bigbtn" id="startbtn">▶ 시작하기</button>
  <div class="keys">
    <span>W A S D = 이동</span>
    <span>스페이스 = 점프</span>
    <span>← ↑ ↓ → = 둘러보기</span>
    <span>Q = 블록 부수기</span>
    <span>E = 블록 놓기</span>
    <span>1~8 = 블록 고르기</span>
    <span style="opacity:.75">마우스를 써도 돼요 (클릭 = 부수기 / 놓기)</span>
  </div>
</div>

<div id="levelfx"></div>
<div id="err"></div>

<!-- Three.js (CDN 3중 백업) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>if(!window.THREE)document.write('<scr'+'ipt src="https://unpkg.com/three@0.150.1/build/three.min.js"><\/scr'+'ipt>');</script>
<script>if(!window.THREE)document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js"><\/scr'+'ipt>');</script>

<script>
(function(){
"use strict";

if(!window.THREE){
  var e=document.getElementById('err');
  e.style.display='flex';
  e.innerHTML='😢 3D 엔진을 불러오지 못했어요.<br>인터넷이 연결되어 있는지 확인하고<br>새로고침(F5) 해 주세요!';
  return;
}

/* ═══════════════════════════════════════════════════
   0. 작은 도구들
   ═══════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;

function makeRng(seed){
  let s = seed>>>0;
  return function(){
    s = (s + 0x6D2B79F5)>>>0;
    let t = s;
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14)>>>0)/4294967296;
  };
}
/* 부드러운 2D 값 노이즈 — 언덕을 만드는 데 사용 */
function valueNoise(seed, gw){
  const rng = makeRng(seed), g = new Float32Array((gw+2)*(gw+2));
  for(let i=0;i<g.length;i++) g[i]=rng();
  const at=(a,b)=>g[clamp(b,0,gw+1)*(gw+2)+clamp(a,0,gw+1)];
  return function(u,v){
    const x=u*gw, z=v*gw, x0=Math.floor(x), z0=Math.floor(z);
    const tx=x-x0, tz=z-z0;
    const sx=tx*tx*(3-2*tx), sz=tz*tz*(3-2*tz);
    const a=at(x0,z0), b=at(x0+1,z0), c=at(x0,z0+1), d=at(x0+1,z0+1);
    const top=a+(b-a)*sx, bot=c+(d-c)*sx;
    return top+(bot-top)*sz;
  };
}

/* ═══════════════════════════════════════════════════
   1. 블록 종류
   ═══════════════════════════════════════════════════ */
const AIR=0, GRASS=1, DIRT=2, STONE=3, WOOD=4, LEAF=5, SAND=6, GLASS=7, RAINBOW=8,
      WATER=9, GOLD=10, PATH_B=11, PATH_S=12, PATH_G=13, PLANK=14;

const BLOCKS = {
  [GRASS]:  {name:'잔디',   icon:'🌱'},
  [DIRT]:   {name:'흙',     icon:'🟫'},
  [STONE]:  {name:'돌',     icon:'🪨'},
  [WOOD]:   {name:'나무',   icon:'🪵'},
  [LEAF]:   {name:'나뭇잎', icon:'🍃'},
  [SAND]:   {name:'모래',   icon:'🏖️'},
  [GLASS]:  {name:'유리',   icon:'🪟',  transparent:true},
  [RAINBOW]:{name:'무지개', icon:'🌈',  glow:true},
  [WATER]:  {name:'물',     icon:'💧',  transparent:true, liquid:true},
  [GOLD]:   {name:'황금',   icon:'⭐',  glow:true},
  [PATH_B]: {name:'동',     icon:'🟤'},
  [PATH_S]: {name:'은',     icon:'⚪'},
  [PATH_G]: {name:'금',     icon:'🟡'},
  [PLANK]:  {name:'판자',   icon:'🟧'},
};
const BLOCK_COLOR = {
  [GRASS]:0x63c64d, [DIRT]:0x96653f, [STONE]:0x9aa0a8, [WOOD]:0x9c6b3f,
  [LEAF]:0x4fbf52, [SAND]:0xf0dfa8, [GLASS]:0xbeebff, [RAINBOW]:0xff7ddb,
  [WATER]:0x49aee0, [GOLD]:0xffc82e, [PATH_B]:0xc87137, [PATH_S]:0xd5dae0,
  [PATH_G]:0xffd93d, [PLANK]:0xd7a96b
};
const RENDER_TYPES = [GRASS,DIRT,STONE,WOOD,LEAF,SAND,GLASS,RAINBOW,GOLD,PATH_B,PATH_S,PATH_G,PLANK];
const isLiquid = t => t===WATER;
const isSolidType = t => t!==AIR && !isLiquid(t);

/* ═══════════════════════════════════════════════════
   2. 블록 그림(텍스처)을 코드로 그리기
   ═══════════════════════════════════════════════════ */
const TS = 16;
function pixelTexture(draw, key){
  const c = document.createElement('canvas'); c.width=c.height=TS;
  const g = c.getContext('2d');
  draw(g, makeRng(key));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;
  t.anisotropy = 1;
  return t;
}
function speckle(g,rng,colors,n){
  for(let i=0;i<n;i++){
    g.fillStyle = colors[(rng()*colors.length)|0];
    g.fillRect((rng()*TS)|0,(rng()*TS)|0,1,1);
  }
}
function flat(base, spots, n){
  return (g,rng)=>{ g.fillStyle=base; g.fillRect(0,0,TS,TS); speckle(g,rng,spots,n||55); };
}
function grassTop(g,rng){
  g.fillStyle='#63c64d'; g.fillRect(0,0,TS,TS);
  speckle(g,rng,['#78d95f','#55b043','#8ae56e'],90);
}
function grassSide(g,rng){
  g.fillStyle='#96653f'; g.fillRect(0,0,TS,TS);
  speckle(g,rng,['#7d5433','#a97a4d'],60);
  for(let x=0;x<TS;x++){
    const h = 4 + ((rng()*3)|0);
    g.fillStyle='#63c64d'; g.fillRect(x,0,1,h);
    g.fillStyle='#78d95f'; g.fillRect(x,0,1,1+((rng()*2)|0));
  }
}
function woodSide(g,rng){
  g.fillStyle='#9c6b3f'; g.fillRect(0,0,TS,TS);
  for(let x=0;x<TS;x+=2){ g.fillStyle = rng()<.5?'#8a5c34':'#ad7a4c'; g.fillRect(x,0,1,TS); }
  speckle(g,rng,['#734a28'],25);
}
function woodTop(g,rng){
  g.fillStyle='#c79a63'; g.fillRect(0,0,TS,TS);
  g.strokeStyle='#8a5c34'; g.lineWidth=1;
  for(let r=2;r<8;r+=2){ g.beginPath(); g.arc(8,8,r,0,7); g.stroke(); }
}
function glassTex(g,rng){
  g.clearRect(0,0,TS,TS);
  g.fillStyle='rgba(190,235,255,.30)'; g.fillRect(0,0,TS,TS);
  g.fillStyle='rgba(255,255,255,.85)';
  g.fillRect(0,0,TS,1); g.fillRect(0,TS-1,TS,1); g.fillRect(0,0,1,TS); g.fillRect(TS-1,0,1,TS);
  g.fillStyle='rgba(255,255,255,.6)'; g.fillRect(3,3,4,1); g.fillRect(3,3,1,4);
}
function rainbowTex(g){
  const cols=['#ff5d5d','#ffa53d','#ffe93d','#6ee86e','#4fc3ff','#9a7dff','#ff7ddb'];
  for(let i=0;i<TS;i++){ g.fillStyle=cols[i%cols.length]; g.fillRect(0,i,TS,1); }
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(0,0,TS,2);
}
function goldTex(g,rng){
  g.fillStyle='#ffc82e'; g.fillRect(0,0,TS,TS);
  speckle(g,rng,['#ffe97a','#e0a200','#fff3b0'],80);
  g.fillStyle='#fff8d0'; g.fillRect(4,4,3,3);
}

const TEX = {};
function buildTextures(){
  TEX[GRASS]   = [grassSide, grassSide, grassTop, flat('#96653f',['#7d5433','#a97a4d']), grassSide, grassSide];
  TEX[DIRT]    = flat('#96653f',['#7d5433','#a97a4d','#855a38']);
  TEX[STONE]   = flat('#9aa0a8',['#868d96','#b2b8bf','#7b828a']);
  TEX[WOOD]    = [woodSide,woodSide,woodTop,woodTop,woodSide,woodSide];
  TEX[LEAF]    = flat('#4fbf52',['#3fa445','#6ad46d','#2f8a38'],110);
  TEX[SAND]    = flat('#f0dfa8',['#e2cd8e','#fbefc4'],70);
  TEX[GLASS]   = glassTex;
  TEX[RAINBOW] = rainbowTex;
  TEX[GOLD]    = goldTex;
  TEX[PATH_B]  = flat('#c87137',['#a85a29','#e08a4c']);
  TEX[PATH_S]  = flat('#d5dae0',['#bcc3cb','#eef2f6']);
  TEX[PATH_G]  = flat('#ffd93d',['#e6b800','#fff0a0']);
  TEX[PLANK]   = flat('#d7a96b',['#c1904f','#e8c390'],40);
}

const MATS = {};
function buildMaterials(){
  for(const t of RENDER_TYPES){
    const def = BLOCKS[t], spec = TEX[t];
    const mk = (drawFn, i) => {
      const map = pixelTexture(drawFn, t*17+i*7+3);
      const o = {map:map};
      if(def.transparent){ o.transparent=true; o.opacity=0.72; o.depthWrite=true; }
      if(def.glow){ o.emissive = new THREE.Color(0x553311); o.emissiveIntensity=0.55; o.emissiveMap=map; }
      return new THREE.MeshLambertMaterial(o);
    };
    MATS[t] = Array.isArray(spec) ? spec.map(mk) : mk(spec,0);
  }
  // 물은 살짝 파랗고 반투명
  MATS[WATER] = new THREE.MeshLambertMaterial({
    color:0x49aee0, transparent:true, opacity:0.62, depthWrite:false
  });
}

/* ═══════════════════════════════════════════════════
   3. 월드 데이터 (64 x 40 x 64 복셀)
   ═══════════════════════════════════════════════════ */
const W=64, H=40, D=64;
const IDX = (x,y,z) => (y*D + z)*W + x;
const voxels = new Uint8Array(W*H*D);
const filled = new Set();           // 공기가 아닌 칸의 인덱스 모음
const SEED = 20260920;
const SPAWN = {x:32.5, y:0, z:36.5};

function inside(x,y,z){ return x>=0&&x<W&&y>=0&&y<H&&z>=0&&z<D; }
function getBlock(x,y,z){ return inside(x,y,z) ? voxels[IDX(x,y,z)] : AIR; }
function solidAt(x,y,z){ return isSolidType(getBlock(x,y,z)); }

function setBlock(x,y,z,t,silent){
  if(!inside(x,y,z)) return false;
  const i = IDX(x,y,z);
  if(voxels[i]===t) return false;
  voxels[i]=t;
  if(t===AIR) filled.delete(i); else filled.add(i);
  if(!silent) worldDirty = true;
  return true;
}

let worldDirty = true;

/* ---- 지형 만들기 ---- */
const heightMap = new Uint8Array(W*D);
function generateWorld(){
  const n1 = valueNoise(SEED, 6);
  const n2 = valueNoise(SEED+991, 15);
  const n3 = valueNoise(SEED+7331, 9);
  const rng = makeRng(SEED+55);

  const VILL = {x:32, z:36, r:12};
  const POND = {x:18, z:20, r:7};

  for(let x=0;x<W;x++) for(let z=0;z<D;z++){
    const u=x/W, v=z/D;
    // 섬 모양: 가장자리로 갈수록 낮아짐
    const dx=(x-32)/32, dz=(z-32)/32;
    const dist = Math.sqrt(dx*dx+dz*dz);
    const island = clamp((1 - dist)*3.2, 0, 1);

    let h = 5 + n1(u,v)*9 + n2(u,v)*3.5;
    h = 2 + (h-2) * (island*island*(3-2*island));

    // 마을은 평평하게
    const dv = Math.hypot(x-VILL.x, z-VILL.z);
    if(dv < VILL.r){
      const k = clamp((VILL.r - dv)/4, 0, 1);
      h = lerp(h, 10, k*k*(3-2*k));
    }
    // 연못은 파이게
    const dp = Math.hypot(x-POND.x, z-POND.z);
    if(dp < POND.r){
      const k = clamp((POND.r - dp)/POND.r, 0, 1);
      h = lerp(h, 5.2, k*k*(3-2*k));
    }
    h = Math.round(clamp(h, 0, 26));
    heightMap[z*W+x] = h;
    if(h<=0) continue;

    for(let y=0;y<h;y++){
      let t = STONE;
      if(y === h-1) t = (h<=7) ? SAND : GRASS;
      else if(y >= h-4) t = (h<=7) ? SAND : DIRT;
      setBlock(x,y,z,t,true);
    }
    // 연못 물 채우기
    if(h < 8){
      for(let y=h;y<8;y++) setBlock(x,y,z,WATER,true);
    }
  }

  // 나무 심기
  for(let i=0;i<70;i++){
    const x = 4 + ((rng()*(W-8))|0), z = 4 + ((rng()*(D-8))|0);
    const h = heightMap[z*W+x];
    if(h < 9 || h > 22) continue;
    if(Math.hypot(x-VILL.x, z-VILL.z) < VILL.r-1) continue;
    if(getBlock(x,h-1,z) !== GRASS) continue;
    const th = 4 + ((rng()*3)|0);
    for(let y=h;y<h+th;y++) setBlock(x,y,z,WOOD,true);
    const top = h+th;
    for(let ox=-2;ox<=2;ox++) for(let oz=-2;oz<=2;oz++) for(let oy=-2;oy<=1;oy++){
      const d2 = ox*ox+oz*oz+oy*oy;
      if(d2 > 5.2) continue;
      const bx=x+ox, by=top+oy, bz=z+oz;
      if(getBlock(bx,by,bz)===AIR) setBlock(bx,by,bz,LEAF,true);
    }
  }

  // 마을 바닥(판자 광장)
  for(let ox=-5;ox<=5;ox++) for(let oz=-5;oz<=5;oz++){
    const x=VILL.x+ox, z=VILL.z+oz;
    if(Math.hypot(ox,oz)>5.3) continue;
    setBlock(x, heightMap[z*W+x]-1, z, PLANK, true);
  }

  // 스폰 위치 정하기
  SPAWN.y = heightMap[(36|0)*W + 32] + 0.2;
  worldDirty = true;
}

/* ═══════════════════════════════════════════════════
   4. Three.js 기본 세팅
   ═══════════════════════════════════════════════════ */

      grp.add(m);

/* ═══════════════════════════════════════════════════
   5. 블록 렌더링 (InstancedMesh, 보이는 면만)
   ═══════════════════════════════════════════════════ */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const instMeshes = {};   // type -> InstancedMesh
const instCap = {};      // type -> 현재 용량
const _m4 = new THREE.Matrix4();

function opaqueAt(x,y,z){
  const t = getBlock(x,y,z);
  if(t===AIR) return false;
  const d = BLOCKS[t];
  return !(d && d.transparent);
}
/* 6면 중 하나라도 바깥에 드러나면 그린다 */
function isExposed(x,y,z){
  return !opaqueAt(x+1,y,z) || !opaqueAt(x-1,y,z) ||
         !opaqueAt(x,y+1,z) || !opaqueAt(x,y-1,z) ||
         !opaqueAt(x,y,z+1) || !opaqueAt(x,y,z-1);
}

let visibleCount = 0;
function rebuildWorldMesh(){
  const lists = {};
  for(const t of RENDER_TYPES) lists[t]=[];
  const water = [];

  for(const i of filled){
    const x = i % W;
    const z = ((i / W)|0) % D;
    const y = (i / (W*D))|0;
    const t = voxels[i];
    if(t===AIR) continue;
    if(t===WATER){ if(getBlock(x,y+1,z)!==WATER) water.push(i); continue; }
    if(!isExposed(x,y,z)) continue;
    (lists[t] || (lists[t]=[])).push(i);
  }

  visibleCount = 0;
  for(const t of RENDER_TYPES){
    const list = lists[t] || [];
    visibleCount += list.length;
    let mesh = instMeshes[t];
    if(!mesh || instCap[t] < list.length){
      if(mesh){ scene.remove(mesh); mesh.dispose(); }
      const cap = Math.max(64, Math.ceil(list.length*1.4)+128);
      mesh = new THREE.InstancedMesh(boxGeo, MATS[t], cap);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.castShadow = !BLOCKS[t].transparent;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      mesh.userData.blockType = t;
      instMeshes[t]=mesh; instCap[t]=cap;
      scene.add(mesh);
    }
    for(let k=0;k<list.length;k++){
      const i=list[k];
      const x=i%W, z=((i/W)|0)%D, y=(i/(W*D))|0;
      _m4.makeTranslation(x+0.5, y+0.5, z+0.5);
      mesh.setMatrixAt(k,_m4);
    }
    mesh.count = list.length;
    mesh.instanceMatrix.needsUpdate = true;
  }

  // 물 표면
  let wm = instMeshes[WATER];
  if(!wm || instCap[WATER] < water.length){
    if(wm){ scene.remove(wm); wm.dispose(); }
    const cap = Math.max(64, water.length+128);
    wm = new THREE.InstancedMesh(boxGeo, MATS[WATER], cap);
    wm.frustumCulled=false; wm.receiveShadow=true;
    instMeshes[WATER]=wm; instCap[WATER]=cap;
    scene.add(wm);
  }
  for(let k=0;k<water.length;k++){
    const i=water[k];
    const x=i%W, z=((i/W)|0)%D, y=(i/(W*D))|0;
    _m4.makeTranslation(x+0.5, y+0.43, z+0.5);
    wm.setMatrixAt(k,_m4);
  }
  wm.count = water.length;
  wm.instanceMatrix.needsUpdate = true;

  worldDirty = false;
}

/* ═══════════════════════════════════════════════════
   6. 캐릭터 (박스로 만든 귀여운 아이)
   ═══════════════════════════════════════════════════ */
function boxMesh(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color:color}));
  m.castShadow = true;
  return m;
}
function faceTexture(){
  return pixelTexture((g)=>{
    g.fillStyle='#ffd9a8'; g.fillRect(0,0,TS,TS);
    g.fillStyle='#3a2a20';
    g.fillRect(4,6,2,3); g.fillRect(10,6,2,3);      // 눈
    g.fillStyle='#ffffff'; g.fillRect(4,6,1,1); g.fillRect(10,6,1,1);
    g.fillStyle='#c4604f'; g.fillRect(6,11,4,1); g.fillRect(5,10,1,1); g.fillRect(10,10,1,1); // 웃는 입
    g.fillStyle='rgba(255,140,140,.5)'; g.fillRect(2,9,2,2); g.fillRect(12,9,2,2); // 볼터치
  }, 777);
}

const SKIN = {body:0xff5b5b, legs:0x4a90d9, arms:0xffd9a8, head:0xffd9a8};

function buildAvatar(colors){
  const g = new THREE.Group();
  const face = faceTexture();
  const headMats = [];
  for(let i=0;i<6;i++){
    headMats.push(new THREE.MeshLambertMaterial(
      i===4 ? {map:face} : {color:colors.head}));
  }
  const head = new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62), headMats);
  head.castShadow=true; head.position.y = 1.42;

  const hair = boxMesh(.66,.16,.66, 0x4b3621); hair.position.y = 1.72;

  const body = boxMesh(.62,.62,.36, colors.body); body.position.y = .95;
  const armL = boxMesh(.22,.60,.24, colors.arms); armL.position.set(-.42,.95,0);
  const armR = boxMesh(.22,.60,.24, colors.arms); armR.position.set( .42,.95,0);
  const legL = boxMesh(.26,.62,.28, colors.legs); legL.position.set(-.16,.33,0);
  const legR = boxMesh(.26,.62,.28, colors.legs); legR.position.set( .16,.33,0);
  // 팔/다리는 위쪽을 중심으로 흔들리게 pivot 그룹 사용
  const pv = (mesh, y) => { const p=new THREE.Group(); p.position.set(mesh.position.x,y,0);
    mesh.position.set(0, mesh.position.y-y, 0); p.add(mesh); g.add(p); return p; };
  g.add(head, hair, body);
  const pArmL = pv(armL, 1.22), pArmR = pv(armR, 1.22);
  const pLegL = pv(legL, .64),  pLegR = pv(legR, .64);

  g.userData = {head, hair, body, pArmL, pArmR, pLegL, pLegR};
  return g;
}

const avatar = buildAvatar(SKIN);
scene.add(avatar);

/* ═══════════════════════════════════════════════════
   7. 플레이어 물리 (중력 + 점프 + 벽 막힘)
   ═══════════════════════════════════════════════════ */
const PW = 0.3;     // 반 너비
const PH = 1.72;    // 키
const player = {
  x:SPAWN.x, y:SPAWN.y, z:SPAWN.z,
  vx:0, vy:0, vz:0,
  onGround:false, yaw:0, pitch:-0.18,
  squash:0, walkPhase:0, inWater:false, rocketLeft:0
};

function anySolidIn(minX,minY,minZ,maxX,maxY,maxZ){
  for(let x=Math.floor(minX); x<=Math.floor(maxX); x++)
   for(let y=Math.floor(minY); y<=Math.floor(maxY); y++)
    for(let z=Math.floor(minZ); z<=Math.floor(maxZ); z++)
      if(solidAt(x,y,z)) return true;
  return false;
}

function moveAxis(axis, d){
  if(d===0) return;
  player[axis] += d;
  const x0=Math.floor(player.x-PW),      x1=Math.floor(player.x+PW);
  const y0=Math.floor(player.y),          y1=Math.floor(player.y+PH-0.001);
  const z0=Math.floor(player.z-PW),      z1=Math.floor(player.z+PW);

  let hit = null;
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++){
    if(!solidAt(x,y,z)) continue;
    const v = axis==='x' ? x : (axis==='y' ? y : z);
    if(hit===null) hit = v;
    else hit = d>0 ? Math.min(hit,v) : Math.max(hit,v);
  }
  if(hit===null) return;

  if(axis==='x'){ player.x = d>0 ? hit-PW-0.001 : hit+1+PW+0.001; player.vx=0; }
  else if(axis==='z'){ player.z = d>0 ? hit-PW-0.001 : hit+1+PW+0.001; player.vz=0; }
  else {
    if(d>0){ player.y = hit-PH-0.001; player.vy=0; }
    else {
      player.y = hit+1;
      if(player.vy < -12){ player.squash = Math.min(1, -player.vy/26); Sound.land(); }
      player.vy = 0; player.onGround = true;
    }
  }
}

const GRAV = -30, JUMP_V = 10.2, SPEED = 6.4, AIR_CTRL = 0.55;

function updatePlayer(dt){
  const f = input.forward(), s = input.strafe();
  let ax=0, az=0;
  if(f||s){
    const len = Math.hypot(f,s);
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
    const rx =  Math.cos(player.yaw), rz = -Math.sin(player.yaw);
    ax = (fx*f + rx*s)/len;
    az = (fz*f + rz*s)/len;
  }
  const mult = player.inWater ? 0.62 : 1;
  const targetVX = ax*SPEED*mult, targetVZ = az*SPEED*mult;
  const k = player.onGround ? 1 : AIR_CTRL;
  player.vx = lerp(player.vx, targetVX, clamp(k*dt*16,0,1));
  player.vz = lerp(player.vz, targetVZ, clamp(k*dt*16,0,1));

  // 물 속인지
  const hx=Math.floor(player.x), hz=Math.floor(player.z);
  player.inWater = getBlock(hx, Math.floor(player.y+0.4), hz)===WATER;

  if(input.jumpWanted() && (player.onGround || player.inWater)){
    player.vy = player.inWater ? JUMP_V*0.62 : JUMP_V;
    player.onGround = false;
    player.rocketLeft = hasUnlock('로켓 점프') ? 1 : 0;
    input.consumeJump();
    Sound.jump();
  } else if(input.jumpWanted() && !player.onGround && player.rocketLeft > 0){
    // 🚀 공중에서 한 번 더! (레벨 7 해금)
    player.rocketLeft = 0;
    player.vy = 9.6;
    input.consumeJump();
    Sound.rocket();
    for(let i=0;i<3;i++)
      Particles.burst(player.x, player.y+0.15, player.z, [0xff7a3d,0xffd93d,0xffffff][i], 10, 3.2);
  }
  if(player.onGround) player.rocketLeft = hasUnlock('로켓 점프') ? 1 : 0;
  if(player.onGround){
    const h = Math.round(player.y);
    if(h > state.maxHeight){ state.maxHeight = h; checkQuests(); }
  }
  player.vy += (player.inWater ? GRAV*0.35 : GRAV) * dt;
  if(player.inWater) player.vy = Math.max(player.vy, -5);
  player.vy = Math.max(player.vy, -45);

  player.onGround = false;
  moveAxis('x', player.vx*dt);
  moveAxis('z', player.vz*dt);
  moveAxis('y', player.vy*dt);

  // 섬 밖으로 떨어져도 죽지 않고 통통 튀어서 돌아오기
  if(player.y < -14){
    bounceBack();
  }

  // 걷기 애니메이션
  const speed = Math.hypot(player.vx, player.vz);
  player.walkPhase += speed*dt*2.6;
  const sw = player.onGround ? Math.sin(player.walkPhase)*clamp(speed/SPEED,0,1)*0.85 : 0.25;
  const ud = avatar.userData;
  ud.pLegL.rotation.x =  sw;
  ud.pLegR.rotation.x = -sw;
  ud.pArmL.rotation.x = -sw*0.8;
  ud.pArmR.rotation.x =  sw*0.8;
  if(!player.onGround){ ud.pArmL.rotation.x = -0.9; ud.pArmR.rotation.x = -0.9; }

  player.squash = Math.max(0, player.squash - dt*3);
  const sq = 1 - player.squash*0.35;
  avatar.scale.set(1/Math.max(sq,.5)*0.95+0.05, sq, 1/Math.max(sq,.5)*0.95+0.05);

  avatar.position.set(player.x, player.y, player.z);
  if(speed>0.4) avatar.rotation.y = lerp2angle(avatar.rotation.y, Math.atan2(player.vx, player.vz), dt*12);
}
function lerp2angle(a,b,t){
  let d = (b-a)%(Math.PI*2);
  if(d> Math.PI) d-=Math.PI*2;
  if(d<-Math.PI) d+=Math.PI*2;
  return a + d*clamp(t,0,1);
}
function bounceBack(){
  player.x = SPAWN.x; player.z = SPAWN.z;
  player.y = SPAWN.y + 14;
  player.vx = player.vz = 0; player.vy = 3;
  showHint('🎈 앗! 통통 튀어서 마을로 돌아왔어요', 1800);
  Sound.bounce();
}

/* ═══════════════════════════════════════════════════
   8. 카메라 (3인칭, 마우스로 둘러보기)
   ═══════════════════════════════════════════════════ */
const camState = {dist:6.2, curDist:6.2};
function updateCamera(dt){
  const hx = player.x, hy = player.y + 1.5, hz = player.z;
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const dirX =  Math.sin(player.yaw)*cp;
  const dirY = -sp;
  const dirZ =  Math.cos(player.yaw)*cp;

  // 벽에 카메라가 박히지 않게 거리 줄이기
  let want = camState.dist;
  const step = 0.25;
  for(let d=step; d<=camState.dist; d+=step){
    const px = hx + dirX*d, py = hy + dirY*d, pz = hz + dirZ*d;
    if(solidAt(Math.floor(px),Math.floor(py),Math.floor(pz))){ want = Math.max(1.1, d-step*1.6); break; }
  }
  camState.curDist = lerp(camState.curDist, want, clamp(dt*14,0,1));
  camera.position.set(hx + dirX*camState.curDist, hy + dirY*camState.curDist, hz + dirZ*camState.curDist);
  camera.lookAt(hx, hy, hz);

  sun.position.set(hx+28, 48, hz+18);
  sun.target.position.set(hx, player.y, hz);
  sun.target.updateMatrixWorld();
}

const LOOK_YAW = 2.1, LOOK_PITCH = 1.5;
function updateLook(dt){
  let ly = 0, lp = 0;
  if(keys['ArrowLeft'])  ly += 1;
  if(keys['ArrowRight']) ly -= 1;
  if(keys['ArrowUp'])    lp -= 1;

/* ═══════════════════════════════════════════════════
   10. 소리 (Web Audio로 직접 합성 — 파일 없음)
   ═══════════════════════════════════════════════════ */
const Sound = (function(){
  let ctx = null, master = null, enabled = true;
  function ensure(){
    if(ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) { enabled=false; return null; }
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.22; master.connect(ctx.destination);
    return ctx;
  }
  function blip(freq, dur, type, vol, slideTo){
    if(!enabled) return;
    const c = ensure(); if(!c) return;
    if(c.state==='suspended') c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'square';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40,slideTo), c.currentTime+dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.5, c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(c.currentTime+dur+0.02);
  }
  function noise(dur, vol, filterHz){
    if(!enabled) return;
    const c = ensure(); if(!c) return;
    const len = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1,len,c.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1)*(1-i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filterHz||1200;
    const g = c.createGain(); g.gain.value = vol||0.4;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }
  return {
    resume(){ const c=ensure(); if(c && c.state==='suspended') c.resume(); },
    setEnabled(v){ enabled=v; },
    isEnabled(){ return enabled; },
    jump(){ blip(420, .13, 'square', .35, 720); },
    land(){ noise(.09,.25,700); },
    bounce(){ blip(200,.28,'sine',.5,900); },
    step(){ noise(.05,.10,500); },
    click(){ blip(660,.06,'square',.25); },
    deny(){ blip(180,.16,'sawtooth',.28,120); },
    placeBlock(){ blip(520,.09,'square',.32,760); noise(.06,.12,900); },
    breakBlock(){ noise(.13,.34,900); blip(330,.11,'square',.22,150); },
    coin(){ blip(880,.09,'square',.3); blip(1320,.12,'square',.22); },
    quest(){ [659,880,1109].forEach((f,i)=> setTimeout(()=>blip(f,.2,'triangle',.42), i*80)); },
    combo(){ [440,554,659,880].forEach((f,i)=> setTimeout(()=>blip(f,.14,'square',.35), i*55)); },
    rocket(){ blip(300,.32,'sawtooth',.34,1100); noise(.24,.2,2200); },
    star(){ [784,988,1319,1568].forEach((f,i)=> setTimeout(()=>blip(f,.16,'triangle',.4), i*60)); },
    fanfare(){ [523,523,523,659,784,1047,1319].forEach((f,i)=> setTimeout(()=>blip(f,.3,'triangle',.5), i*140)); },
    levelUp(){ [523,659,784,1047].forEach((f,i)=> setTimeout(()=>blip(f,.22,'triangle',.45), i*90)); }
  };
})();

const SAVE_KEY = 'blockworld_save_v4';

  coins:0, exp:0, level:1,

  coinsEarned:0, maxHeight:0, rainbowPlaced:0, combosMade:0, goldFound:0,

  collected:{},            // 이미 먹은 코인/별
  obbyDone:{}              // 완주한 코스
};
const EXP_NEED = lv => 60 + (lv-1)*45;

let saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
function saveNow(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:4, coins:state.coins, exp:state.exp, level:state.level,
      placed:state.placed, broken:state.broken, starsGot:state.starsGot,
      coinsEarned:state.coinsEarned, maxHeight:state.maxHeight,
      rainbowPlaced:state.rainbowPlaced, combosMade:state.combosMade, goldFound:state.goldFound,
      quests:state.quests, questsDone:state.questsDone,
      edits:state.edits, collected:state.collected, obbyDone:state.obbyDone,
      pos:{x:player.x, y:player.y, z:player.z}, slot:selectedSlot
    }));
  }catch(e){ /* 저장 공간이 없어도 게임은 계속 */ }
}
function loadSave(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){ return; }
  if(!raw) return;
  let d; try{ d = JSON.parse(raw); }catch(e){ return; }
  if(!d || d.v !== 4) return;
  state.coins = d.coins|0; state.exp = d.exp|0; state.level = Math.max(1, d.level|0);
  state.placed = d.placed|0; state.broken = d.broken|0; state.starsGot = d.starsGot|0;
  state.edits = d.edits || {};
  state.collected = d.collected || {};
  state.obbyDone = d.obbyDone || {};
  state.coinsEarned = d.coinsEarned|0; state.maxHeight = d.maxHeight|0;
  state.rainbowPlaced = d.rainbowPlaced|0; state.combosMade = d.combosMade|0;
  state.goldFound = d.goldFound|0;
  state.quests = Array.isArray(d.quests) ? d.quests : [];
  state.questsDone = d.questsDone || {};
  if(typeof d.slot === 'number') selectedSlot = clamp(d.slot,0,7);
  if(d.pos && isFinite(d.pos.x)){ SPAWN_LOAD = d.pos; }
}
let SPAWN_LOAD = null;

function applyEdits(){
  for(const k in state.edits){
    const a = k.split(',');
    setBlock(+a[0], +a[1], +a[2], state.edits[k]|0, true);
  }
  worldDirty = true;
}
function recordEdit(x,y,z,t){ state.edits[x+','+y+','+z] = t; saveSoon(); }

function addExp(n){
  state.exp += n;
  let up = false;
  while(state.exp >= EXP_NEED(state.level)){
    state.exp -= EXP_NEED(state.level);
    state.level++;

}

const HOTBAR = [GRASS, DIRT, STONE, WOOD, LEAF, SAND, GLASS, RAINBOW];
const UNLOCK_LEVEL = {[GLASS]:2, [RAINBOW]:3};

/* ═══════════════════════════════════════════════════
   10.7 반짝이는 조각 (파티클)
   ═══════════════════════════════════════════════════ */
const Particles = (function(){
  const CAP = 260;
  const geo = new THREE.BoxGeometry(.16,.16,.16);
  // vertexColors 를 쓰면 지오메트리에 color 속성이 꼭 있어야 한다.
  // 없으면 색이 (0,0,0)으로 들어가 조각이 전부 까맣게 나온다.
  {
    const n = geo.attributes.position.count;
    const white = new Float32Array(n*3); white.fill(1);
    geo.setAttribute('color', new THREE.BufferAttribute(white, 3));
  }
  const mat = new THREE.MeshLambertMaterial({vertexColors:true});
  const mesh = new THREE.InstancedMesh(geo, mat, CAP);
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CAP*3), 3);
  mesh.frustumCulled = false;
  mesh.count = CAP;
  scene.add(mesh);

  const ps = [];
  for(let i=0;i<CAP;i++) ps.push({life:0, x:0,y:0,z:0, vx:0,vy:0,vz:0, s:1, spin:0});
  let cursor = 0;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(),
        v3 = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color();

  function burst(x,y,z,color,count,power){
    power = power || 4.2;
    for(let i=0;i<(count||14);i++){
      const slot = cursor; const p = ps[slot]; cursor = (cursor+1)%CAP;
      p.life = 0.5 + Math.random()*0.45;
      p.max = p.life;
      p.x=x; p.y=y; p.z=z;
      p.vx=(Math.random()-.5)*power; p.vy=Math.random()*power*0.9+1.2; p.vz=(Math.random()-.5)*power;
      p.s = 0.6 + Math.random()*0.8;
      p.spin = (Math.random()-.5)*12;
      col.set(color);
      const j = 0.85 + Math.random()*0.3;
      mesh.instanceColor.setXYZ(slot, col.r*j, col.g*j, col.b*j);
    }
    mesh.instanceColor.needsUpdate = true;
  }
  function update(dt){
    for(let i=0;i<CAP;i++){
      const p = ps[i];
      if(p.life <= 0){ m4.makeScale(0,0,0); mesh.setMatrixAt(i,m4); continue; }
      p.life -= dt;
      p.vy -= 22*dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
      if(solidAt(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z))){ p.vy = Math.abs(p.vy)*0.35; p.y += 0.06; }
      const k = clamp(p.life/(p.max||1),0,1);
      v3.set(p.x,p.y,p.z);
      q.setFromAxisAngle(new THREE.Vector3(0.3,1,0.5).normalize(), p.spin*(1-k));
      const sz = p.s*k;
      sc.set(sz,sz,sz);
      m4.compose(v3,q,sc);
      mesh.setMatrixAt(i,m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  return {burst, update};
})();

/* ═══════════════════════════════════════════════════
   10.8 블록 조준 (복셀 레이캐스트) + 설치 / 파괴
   ═══════════════════════════════════════════════════ */
const REACH = 6.2;
const _dir = new THREE.Vector3();

function raycastVoxel(ox,oy,oz, dx,dy,dz, maxDist){
  let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
  const sx = dx>0?1:(dx<0?-1:0), sy = dy>0?1:(dy<0?-1:0), sz = dz>0?1:(dz<0?-1:0);
  const tdx = dx!==0 ? Math.abs(1/dx) : Infinity;
  const tdy = dy!==0 ? Math.abs(1/dy) : Infinity;
  const tdz = dz!==0 ? Math.abs(1/dz) : Infinity;
  let tmx = dx!==0 ? ((dx>0 ? x+1-ox : ox-x) * tdx) : Infinity;
  let tmy = dy!==0 ? ((dy>0 ? y+1-oy : oy-y) * tdy) : Infinity;
  let tmz = dz!==0 ? ((dz>0 ? z+1-oz : oz-z) * tdz) : Infinity;
  let nx=0, ny=0, nz=0, t=0;

  for(let i=0;i<160;i++){
    if(y>=0 && y<H && isSolidType(getBlock(x,y,z))) return {x,y,z, nx,ny,nz};
    if(tmx < tmy && tmx < tmz){ t=tmx; if(t>maxDist) break; x+=sx; tmx+=tdx; nx=-sx; ny=0; nz=0; }
    else if(tmy < tmz){       t=tmy; if(t>maxDist) break; y+=sy; tmy+=tdy; nx=0; ny=-sy; nz=0; }
    else {                    t=tmz; if(t>maxDist) break; z+=sz; tmz+=tdz; nx=0; ny=0; nz=-sz; }
    if(y<-2 || y>H+2) break;
  }
  return null;
}

let aimed = null;
const highlight = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.012,1.012,1.012)),
  new THREE.LineBasicMaterial({color:0x201830, transparent:true, opacity:.75})
);
highlight.visible = false;
scene.add(highlight);

function updateAim(){
  camera.getWorldDirection(_dir);
  const ox = player.x, oy = player.y + 1.5, oz = player.z;
  aimed = raycastVoxel(ox,oy,oz, _dir.x,_dir.y,_dir.z, REACH);
  if(aimed){
    highlight.visible = true;
    highlight.position.set(aimed.x+0.5, aimed.y+0.5, aimed.z+0.5);
  } else highlight.visible = false;
  $('#crosshair').style.transform = aimed ? 'scale(1.3)' : 'scale(1)';
}

function playerBoxOverlaps(x,y,z){
  return (player.x+PW > x && player.x-PW < x+1) &&
         (player.y+PH > y && player.y      < y+1) &&
         (player.z+PW > z && player.z-PW < z+1);
}

function breakBlock(){
  if(!aimed) return false;
  const {x,y,z} = aimed;
  if(y <= 0){ showHint('🪨 섬의 바닥은 부술 수 없어요', 1500); Sound.deny(); return false; }
  const t = getBlock(x,y,z);
  if(t === AIR) return false;
  setBlock(x,y,z,AIR);
  recordEdit(x,y,z,AIR);
  Particles.burst(x+.5, y+.5, z+.5, BLOCK_COLOR[t] || 0xffffff, 16);
  Sound.breakBlock();
  state.broken++;
  addExp(1);
  checkQuests();
  return true;
}
function placeBlock(){
  if(!aimed) return false;
  const t = HOTBAR[selectedSlot];
  if(!blockUnlocked(t)){ Sound.deny(); return false; }
  const x = aimed.x + aimed.nx, y = aimed.y + aimed.ny, z = aimed.z + aimed.nz;
  if(!inside(x,y,z)) return false;
  const cur = getBlock(x,y,z);
  if(cur !== AIR && cur !== WATER) return false;
  if(playerBoxOverlaps(x,y,z)){ showHint('🙅 내가 서 있는 자리에는 못 놓아요', 1500); Sound.deny(); return false; }
  setBlock(x,y,z,t);
  recordEdit(x,y,z,t);
  Particles.burst(x+.5, y+.5, z+.5, BLOCK_COLOR[t] || 0xffffff, 10, 3);
  Sound.placeBlock();
  state.placed++;
  if(t === RAINBOW) state.rainbowPlaced++;
  addExp(2);
  checkQuests();
  return true;
}

/* 마우스 / 키 연결 */
const mouseDown = [false,false,false];
let actCooldown = 0;
canvas.addEventListener('mousedown', e=>{
  if(!started) return;
  if(!locked){ requestLock(); return; }
  mouseDown[e.button] = true;
  if(e.button===0) { if(breakBlock()) actCooldown = 0.22; }
  if(e.button===2) { if(placeBlock()) actCooldown = 0.22; }
});
addEventListener('mouseup', e=>{ mouseDown[e.button] = false; });
addEventListener('wheel', e=>{
  if(!started || !locked) return;
  selectSlot(selectedSlot + (e.deltaY>0 ? 1 : -1));
}, {passive:true});
addEventListener('keydown', e=>{
  if(e.code.startsWith('Digit')){
    const n = +e.code.slice(5);
    if(n>=1 && n<=8) selectSlot(n-1);
  }
});
function updateActions(dt){
  actCooldown -= dt;
  if(actCooldown > 0) return;
  const wantBreak = keys['KeyQ'] || keys['KeyF'] || touch.breaking || (locked && mouseDown[0]);
  const wantPlace = keys['KeyE'] || keys['KeyR'] || touch.placing  || (locked && mouseDown[2]);
  if(wantBreak && breakBlock()) actCooldown = 0.22;
  else if(wantPlace && placeBlock()) actCooldown = 0.22;
}

/* ═══════════════════════════════════════════════════
   10.9 점프 코스(오비) 3개 만들기
   ═══════════════════════════════════════════════════ */
const OBBIES = [
  {id:'bronze', name:'동 코스', emoji:'🥉', block:PATH_B, color:0xc87137,
   seed:101, ang0:-1.45, rad:27.5, count:16, size:1, gap:4.0, gapUp:3.4, y0:14, y1:20,
   coins:120, exp:90},
  {id:'silver', name:'은 코스', emoji:'🥈', block:PATH_S, color:0xd5dae0,

   coins:250, exp:200},
  {id:'gold',   name:'금 코스', emoji:'🥇', block:PATH_G, color:0xffd93d,

const obbyBlockOwner = new Map();   // 복셀 index -> [코스번호, 발판번호]
const flags = [];

function buildObbies(){
  OBBIES.forEach((o, ci)=>{
    const rng = makeRng(o.seed);
    o.plats = [];

    /* 1) 섬 위 출발대 + 멀리서도 보이는 기둥 */
    const sx = Math.round(32 + Math.cos(o.ang0)*22);
    const sz = Math.round(32 + Math.sin(o.ang0)*22);
    const sy = heightMap[sz*W+sx];
    o.start = {x:sx+0.5, y:sy, z:sz+0.5};
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++)
      setBlock(sx+dx, sy, sz+dz, o.block, true);
    for(let k=1;k<=7;k++) setBlock(sx, sy+k, sz, k>4 ? o.block : WOOD, true);

    /* 1-b) 출발대에서 첫 발판까지 이어지는 계단 */
    o.stairFrom = {x:sx, y:sy, z:sz};

    /* 2) 하늘로 이어지는 발판들 (호를 그리며 점점 높아짐)
       측정한 점프 거리: 같은 높이 4.27칸, 한 칸 위 3.41칸.
       그래서 발판 중심 간격은 평지 o.gap, 한 칸 오를 때 o.gapUp 으로 제한한다. */
    let ang = o.ang0, rad = o.rad, y = o.y0;
    let px = Math.round(32 + Math.cos(ang)*rad), pz = Math.round(32 + Math.sin(ang)*rad);
    for(let i=0;i<o.count;i++){
      o.plats.push({x:px, y:y, z:pz});
      for(let dx=-o.size; dx<=o.size; dx++) for(let dz=-o.size; dz<=o.size; dz++){
        if(!inside(px+dx, y, pz+dz)) continue;
        setBlock(px+dx, y, pz+dz, o.block, true);
        obbyBlockOwner.set(IDX(px+dx, y, pz+dz), [ci, i]);
      }
      // 다음 발판 자리 정하기 — 반올림 뒤 실제 거리가 한계를 넘으면 좁혀서 다시 시도
      const wantY = o.y0 + Math.round((o.y1 - o.y0) * (i+1) / o.count);
      const rise = clamp(wantY - y, 0, 1);
      const maxD = rise > 0 ? o.gapUp : o.gap;
      const minD = 2*o.size + 1.5;
      let nx = px, nz = pz, arc = maxD, ok = false;
      const dRad = (rng()-0.5)*1.1;
      for(let tryN=0; tryN<8; tryN++){
        const a2 = ang + arc/rad;
        const r2 = clamp(rad + dRad, 26.8, 29.2);
        nx = Math.round(32 + Math.cos(a2)*r2);
        nz = Math.round(32 + Math.sin(a2)*r2);
        const d = Math.hypot(nx-px, nz-pz);
        if(d <= maxD + 0.01 && d >= minD){ ang = a2; rad = r2; ok = true; break; }
        arc -= 0.25;
        if(arc < minD) break;
      }
      if(!ok){ ang += maxD/rad; nx = Math.round(32 + Math.cos(ang)*rad); nz = Math.round(32 + Math.sin(ang)*rad); }
      px = nx; pz = nz; y = y + rise;
    }
    o.endAng = ang; o.endRad = rad; o.endY = y;

    /* 2-b) 계단 놓기 */
    buildStairs(o.stairFrom, o.plats[0], o.block, ci);

    /* 3) 도착 발판 + 깃발 */
    const lastP = o.plats[o.plats.length-1];
    const prevP = o.plats[o.plats.length-2] || lastP;
    // 마지막 발판에서 가던 방향 그대로, 뛸 수 있는 거리 안에 도착 발판을 놓는다
    let ux = lastP.x - prevP.x, uz = lastP.z - prevP.z;
    const ul = Math.hypot(ux,uz) || 1;
    ux /= ul; uz /= ul;
    let gx = lastP.x, gz = lastP.z;
    for(let d = o.gapUp; d >= 2*o.size+1.5; d -= 0.2){
      const cx = Math.round(lastP.x + ux*d), cz = Math.round(lastP.z + uz*d);
      const real = Math.hypot(cx-lastP.x, cz-lastP.z);
      if(real >= 2*o.size+1.5 && real <= o.gapUp + 0.01 && inside(cx,0,cz)){ gx=cx; gz=cz; break; }
    }
    const gy = o.endY;
    o.goal = {x:gx, y:gy, z:gz};
    for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++){
      if(Math.hypot(dx,dz)>2.4 || !inside(gx+dx,gy,gz+dz)) continue;
      setBlock(gx+dx, gy, gz+dz, o.block, true);
      obbyBlockOwner.set(IDX(gx+dx,gy,gz+dz), [ci, o.count]);
    }
    flags.push(makeFlag(gx+0.5, gy+1, gz+0.5, o.color, ci));
  });
}

/* 두 지점을 한 칸씩 올라가는 계단으로 이어 붙인다 */
function buildStairs(from, to, block, ci){
  const dx = to.x - from.x, dz = to.z - from.z;
  const steps = Math.max(Math.abs(dx), Math.abs(dz), Math.abs(to.y - from.y));
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    const x = Math.round(from.x + dx*t);
    const z = Math.round(from.z + dz*t);
    const y = Math.round(from.y + (to.y - from.y)*t);
    for(let ox=-1; ox<=1; ox++) for(let oz=-1; oz<=1; oz++){
      if(Math.abs(ox)+Math.abs(oz) > 1) continue;
      if(!inside(x+ox,y,z+oz)) continue;
      if(isSolidType(getBlock(x+ox,y,z+oz))) continue;
      setBlock(x+ox, y, z+oz, block, true);
      obbyBlockOwner.set(IDX(x+ox,y,z+oz), [ci, 0]);
    }
    // 계단 위로 2칸은 비워서 머리가 안 걸리게
    for(let cy=1; cy<=2; cy++) if(getBlock(x,y+cy,z)!==AIR && !BLOCKS[getBlock(x,y+cy,z)].liquid) setBlock(x,y+cy,z,AIR,true);
  }
}

function makeFlag(x,y,z,color,ci){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.BoxGeometry(.12,3.2,.12),
    new THREE.MeshLambertMaterial({color:0x8a6a4a}));
  pole.position.y = 1.6; pole.castShadow = true;
  const cloth = new THREE.Mesh(new THREE.BoxGeometry(1.1,.7,.06),
    new THREE.MeshLambertMaterial({color:color, emissive:color, emissiveIntensity:.25}));
  cloth.position.set(.6, 2.8, 0); cloth.castShadow = true;
  g.add(pole, cloth);
  g.position.set(x,y,z);
  g.userData = {cloth, ci, t:Math.random()*6};
  scene.add(g);
  return g;
}

const Collect = (function(){
  const coinGeo = new THREE.CylinderGeometry(.30,.30,.09,14);
  coinGeo.rotateX(Math.PI/2);
  const coinMat = new THREE.MeshLambertMaterial({color:0xffc82e, emissive:0xffa000, emissiveIntensity:.45});
  const starGeo = new THREE.OctahedronGeometry(.38,0);
  starGeo.scale(1,1.35,1);
  const starMat = new THREE.MeshLambertMaterial({color:0xfff2a0, emissive:0xffd93d, emissiveIntensity:.6});

  let coins = [], stars = [], coinMesh = null, starMesh = null;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(),
        v3 = new THREE.Vector3(), sc = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);

  function topAt(x,z){
    for(let y=H-1;y>=0;y--) if(isSolidType(getBlock(x,y,z))) return y+1;
    return 0;
  }
  function build(){
    const rng = makeRng(SEED+4242);
    coins = []; stars = [];

    /* 땅 위 코인 (쉬움) */
    let tries = 0;
    while(coins.length < 70 && tries < 4000){
      tries++;
      const x = 3 + ((rng()*(W-6))|0), z = 3 + ((rng()*(D-6))|0);
      const y = topAt(x,z);
      if(y < 8 || y > 26) continue;                       // 물속·너무 높은 곳 제외
      if(getBlock(x,y,z) !== AIR) continue;
      coins.push({x:x+0.5, y:y+0.55, z:z+0.5, id:'c'+coins.length});
    }
    /* 점프 코스 위 코인 (어려움) */
    OBBIES.forEach(o=>{
      o.plats.forEach((p,i)=>{
        if(i%2 === 1) return;
        coins.push({x:p.x+0.5, y:p.y+1.55, z:p.z+0.5, id:'c'+coins.length});
      });
    });
    /* 별: 나무 꼭대기와 높은 언덕, 코스 중간 */
    tries = 0;
    while(stars.length < 8 && tries < 3000){
      tries++;
      const x = 4 + ((rng()*(W-8))|0), z = 4 + ((rng()*(D-8))|0);
      const y = topAt(x,z);
      if(y < 16) continue;
      stars.push({x:x+0.5, y:y+0.9, z:z+0.5, id:'s'+stars.length});
    }
    OBBIES.forEach(o=>{
      const p = o.plats[Math.floor(o.plats.length/2)];
      stars.push({x:p.x+0.5, y:p.y+2.4, z:p.z+0.5, id:'s'+stars.length});
    });

    coinMesh = new THREE.InstancedMesh(coinGeo, coinMat, Math.max(1,coins.length));
    starMesh = new THREE.InstancedMesh(starGeo, starMat, Math.max(1,stars.length));
    coinMesh.frustumCulled = false; starMesh.frustumCulled = false;
    coinMesh.castShadow = true; starMesh.castShadow = true;
    scene.add(coinMesh); scene.add(starMesh);
    refresh();
  }
  function taken(id){ return !!state.collected[id]; }
  function refresh(){
    if(coinMesh) coinMesh.count = coins.length;
    if(starMesh) starMesh.count = stars.length;
  }

  let t = 0;
  function update(dt){
    t += dt;
    let got = 0;
    for(let i=0;i<coins.length;i++){
      const c = coins[i];
      if(taken(c.id)){ m4.makeScale(0,0,0); coinMesh.setMatrixAt(i,m4); continue; }
      const bob = Math.sin(t*2.4 + i*0.7)*0.12;
      q.setFromAxisAngle(up, t*2.2 + i);
      v3.set(c.x, c.y+bob, c.z); sc.set(1,1,1);
      m4.compose(v3,q,sc); coinMesh.setMatrixAt(i,m4);
      if(dist2(c) < 1.35*1.35) { pickCoin(c); got++; }
    }
    coinMesh.instanceMatrix.needsUpdate = true;

    for(let i=0;i<stars.length;i++){
      const c = stars[i];
      if(taken(c.id)){ m4.makeScale(0,0,0); starMesh.setMatrixAt(i,m4); continue; }
      const bob = Math.sin(t*1.8 + i)*0.18;
      q.setFromAxisAngle(up, t*1.4 + i);
      v3.set(c.x, c.y+bob, c.z);
      const pulse = 1 + Math.sin(t*4+i)*0.08;
      sc.set(pulse,pulse,pulse);
      m4.compose(v3,q,sc); starMesh.setMatrixAt(i,m4);
      if(dist2(c) < 1.5*1.5) pickStar(c);
    }
    starMesh.instanceMatrix.needsUpdate = true;
  }
  function dist2(c){
    const dx = c.x-player.x, dy = c.y-(player.y+0.9), dz = c.z-player.z;
    return dx*dx + dy*dy + dz*dz;
  }
  function remaining(){
    let n=0;
    for(const c of coins) if(!taken(c.id)) n++;
    for(const c of stars) if(!taken(c.id)) n++;
    return n;
  }
  function nearestUncollected(){
    let best=null, bd=1e9;
    for(const c of coins){
      if(taken(c.id)) continue;
      const dx=c.x-player.x, dz=c.z-player.z, d=dx*dx+dz*dz;
      if(d<bd){ bd=d; best=c; }
    }
    return best ? {c:best, d:Math.sqrt(bd)} : null;
  }
  return {build, update, remaining, nearestUncollected,
          count(){ return {coins:coins.length, stars:stars.length}; }};
})();

function pickCoin(c){
  state.collected[c.id] = 1;
  registerCoinForCombo();
  const amount = gainCoins(1);
  Particles.burst(c.x, c.y, c.z, comboOn ? 0xff7a3d : 0xffd93d, comboOn ? 20 : 12, 3.4);
  Sound.coin();
  popText('+' + amount + (comboOn ? ' 🔥' : ''), comboOn ? '#ffb36b' : '#ffe66d');
  sparkleBoost();
  addExp(4);
  checkQuests();
  saveSoon();
}
function pickStar(c){
  state.collected[c.id] = 1;
  gainCoins(10);
  state.starsGot = (state.starsGot||0) + 1;
  Particles.burst(c.x, c.y, c.z, 0xfff2a0, 26, 5.5);
  Sound.star();
  popText('⭐ +10', '#fff6b0');
  sparkleBoost();
  addExp(30);
  checkQuests();
  saveSoon();
}

/* 코인을 먹으면 캐릭터 주변이 반짝 */
const sparkles = (function(){
  const N = 8;
  const geo = new THREE.BoxGeometry(.11,.11,.11);
  const mat = new THREE.MeshBasicMaterial({color:0xfff3a0});
  const mesh = new THREE.InstancedMesh(geo, mat, N);
  mesh.frustumCulled = false; mesh.count = N;
  scene.add(mesh);
  const m4 = new THREE.Matrix4(), v3 = new THREE.Vector3(),
        q = new THREE.Quaternion(), sc = new THREE.Vector3();
  let power = 0, t = 0;
  return {
    boost(){ power = Math.min(1.6, power + 0.9); },
    update(dt){
      t += dt; power = Math.max(0, power - dt*0.55);
      const base = state.coins > 0 ? 0.28 : 0;
      const amp = Math.min(1, base + power);
      for(let i=0;i<N;i++){
        const a = t*2.6 + i*(Math.PI*2/N);
        const r = 0.75 + Math.sin(t*3+i)*0.12;
        v3.set(player.x + Math.cos(a)*r,
               player.y + 0.7 + Math.sin(t*4+i*1.3)*0.45,
               player.z + Math.sin(a)*r);
        const sz = amp * (0.7 + Math.sin(t*7+i)*0.3);
        sc.set(sz,sz,sz);
        m4.compose(v3,q,sc);
        mesh.setMatrixAt(i,m4);
      }
      mesh.instanceMatrix.needsUpdate = true;
    }
  };
})();
function sparkleBoost(){ sparkles.boost(); }

/* ═══════════════════════════════════════════════════
   10.11 코스 진행 · 완주 판정 · 떨어지면 되돌리기
   ═══════════════════════════════════════════════════ */
let curObby = -1, obbyCheckpoint = null;

function updateObby(dt){
  // 지금 밟고 있는 블록이 어느 코스인지
  const bx = Math.floor(player.x), bz = Math.floor(player.z), by = Math.floor(player.y - 0.1);
  const owner = obbyBlockOwner.get(IDX(bx,by,bz));
  if(owner && player.onGround){
    curObby = owner[0];
    const o = OBBIES[curObby];
    obbyCheckpoint = {x:player.x, y:player.y, z:player.z};
    if(owner[1] >= o.count && !state.obbyDone[o.id]) finishObby(curObby);
  } else if(player.onGround && player.y < 30 && !owner){
    const h = heightMap[clamp(bz,0,D-1)*W + clamp(bx,0,W-1)];
    if(player.y <= h + 0.5) { curObby = -1; obbyCheckpoint = null; }
  }

  // 코스에서 떨어지면 마지막 발판으로 통통
  if(curObby >= 0 && obbyCheckpoint && player.y < obbyCheckpoint.y - 7){
    player.x = obbyCheckpoint.x; player.y = obbyCheckpoint.y + 0.4; player.z = obbyCheckpoint.z;
    player.vx = player.vy = player.vz = 0;
    Sound.bounce();
    showHint('🎈 괜찮아요! 방금 발판으로 돌려놨어요', 1800);
  }

  // 깃발 펄럭임
  for(const f of flags){
    f.userData.t += dt;
    const done = state.obbyDone[OBBIES[f.userData.ci].id];
    f.userData.cloth.rotation.y = Math.sin(f.userData.t*2.2)*0.35;
    f.userData.cloth.scale.y = done ? 1.25 : 1;
    f.userData.cloth.material.emissiveIntensity = done ? 0.75 : 0.25;
  }
}

function finishObby(ci){
  const o = OBBIES[ci];
  state.obbyDone[o.id] = 1;
  gainCoins(o.coins, true);
  showBanner(o.emoji + ' ' + o.name + ' 완주!', '코인 +' + o.coins + '  ·  EXP +' + o.exp);
  Sound.fanfare();
  for(let i=0;i<5;i++)
    setTimeout(()=> Particles.burst(player.x, player.y+1, player.z,
      [0xff5d5d,0xffd93d,0x6ee86e,0x4fc3ff,0xff7ddb][i], 24, 7), i*110);
  addExp(o.exp);
  checkQuests();
  saveSoon();
}

function showBanner(big, small){
  const el = $('#banner');
  el.innerHTML = big + (small ? '<span class="small">'+small+'</span>' : '');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

/* ---- 퀘스트 목록 ---- */
const QUEST_POOL = [
  {id:'coin10',  icon:'🪙', text:'코인 {g}개 모으기',      goal:10, coins:20, exp:35, track:()=>state.coinsEarned},
  {id:'coin25',  icon:'🪙', text:'코인 {g}개 모으기',      goal:25, coins:45, exp:70, track:()=>state.coinsEarned},
  {id:'build20', icon:'🧱', text:'블록 {g}개 쌓기',        goal:20, coins:25, exp:45, track:()=>state.placed},
  {id:'build50', icon:'🏰', text:'블록 {g}개 쌓기',        goal:50, coins:60, exp:90, track:()=>state.placed},
  {id:'dig15',   icon:'⛏️', text:'블록 {g}개 부수기',      goal:15, coins:20, exp:35, track:()=>state.broken},
  {id:'star2',   icon:'⭐', text:'별 {g}개 찾기',           goal:2,  coins:50, exp:80, track:()=>state.starsGot},

  {id:'high22',  icon:'🪜', text:'높이 {g}칸까지 올라가기', goal:22, coins:40, exp:60, track:()=>state.maxHeight},
  {id:'rain8',   icon:'🌈', text:'무지개 블록 {g}개 놓기',  goal:8,  coins:55, exp:85, track:()=>state.rainbowPlaced, need:'무지개 블록'},
  {id:'obbyB',   icon:'🥉', text:'동 코스 완주하기',        goal:1,  coins:80, exp:120, track:()=>state.obbyDone.bronze?1:0},
  {id:'obbyS',   icon:'🥈', text:'은 코스 완주하기',        goal:1,  coins:150, exp:220, track:()=>state.obbyDone.silver?1:0},
  {id:'obbyG',   icon:'🥇', text:'금 코스 완주하기',        goal:1,  coins:300, exp:400, track:()=>state.obbyDone.gold?1:0},
  {id:'combo1',  icon:'🔥', text:'콤보 {g}번 터뜨리기',     goal:1,  coins:45, exp:70, track:()=>state.combosMade},
  {id:'gold1',   icon:'✨', text:'황금 블록 {g}개 찾기',    goal:1,  coins:100, exp:150, track:()=>state.goldFound},
];
const questDef = id => QUEST_POOL.find(q=>q.id===id);

function questAvailable(q){
  if(state.questsDone[q.id]) return false;
  if(state.quests.some(a=>a.id===q.id)) return false;
  if(q.need && !hasUnlock(q.need)) return false;
  if(q.id==='gold1' && !GOLD_EVENT_READY) return false;
  return true;
}
let GOLD_EVENT_READY = false;   // 5단계에서 황금 블록이 생기면 true

function pickNewQuest(){
  const pool = QUEST_POOL.filter(questAvailable);
  if(!pool.length) return null;
  // 이미 많이 진행된 것보다 이제 막 시작할 수 있는 걸 고른다
  const q = pool[Math.floor(Math.random()*pool.length)];
  return {id:q.id, base:q.track()};
}
function refillQuests(){
  while(state.quests.length < 3){
    const nq = pickNewQuest();
    if(!nq) break;
    state.quests.push(nq);
  }
  renderQuests();
  saveSoon();
}
function questProgress(a){
  const q = questDef(a.id);
  if(!q) return {cur:0, goal:1};
  const cur = clamp(q.track() - a.base, 0, q.goal);
  return {cur, goal:q.goal};
}
function renderQuests(){
  const list = $('#qlist');
  list.innerHTML = '';
  if(!state.quests.length){
    list.innerHTML = '<div class="qtx" style="opacity:.6">모든 퀘스트를 다 했어요! 🎊</div>';
    return;
  }
  state.quests.forEach(a=>{
    const q = questDef(a.id); if(!q) return;
    const {cur, goal} = questProgress(a);
    const el = document.createElement('div');
    el.className = 'quest' + (a.done ? ' done' : '');
    el.dataset.qid = a.id;
    el.innerHTML =
      '<div class="qic">'+q.icon+'</div>' +
      '<div class="qbody">' +
        '<div class="qtx">'+q.text.replace('{g}', goal)+'</div>' +
        '<div class="qbar"><div class="qfill" style="width:'+(cur/goal*100)+'%"></div></div>' +
        '<div class="qnum">'+cur+' / '+goal+'  ·  🪙'+q.coins+' ✨'+q.exp+'</div>' +
      '</div>';
    list.appendChild(el);
  });
}
function checkQuests(){
  let changed = false;
  for(const a of state.quests){
    if(a.done) continue;
    const {cur, goal} = questProgress(a);
    if(cur >= goal){
      a.done = true;
      const q = questDef(a.id);
      state.questsDone[q.id] = 1;
      gainCoins(q.coins, true);
      addExp(q.exp);
      Sound.quest();
      popText('📋 퀘스트 완료!', '#7ae582');
      showHint('✅ ' + q.text.replace('{g}', q.goal) + ' 완료!  🪙+' + q.coins, 2600);
      changed = true;
      setTimeout(()=>{
        const i = state.quests.indexOf(a);
        if(i >= 0) state.quests.splice(i,1);
        refillQuests();
      }, 1700);
    }
  }
  renderQuests();
  if(changed) saveSoon();
}

/* ---- 콤보: 30초 안에 코인 5개 ---- */
const COMBO_WINDOW = 30, COMBO_NEED = 5;
let comboTimes = [], comboOn = false, comboHideAt = 0;

function registerCoinForCombo(){
  const now = performance.now()/1000;
  comboTimes.push(now);
  comboTimes = comboTimes.filter(t => now - t <= COMBO_WINDOW);
  const wasOn = comboOn;
  comboOn = comboTimes.length >= COMBO_NEED;
  if(comboOn && !wasOn){
    state.combosMade = (state.combosMade||0) + 1;
    showCombo('🔥 콤보! 코인 2배!');
    Sound.combo();
    checkQuests();
  } else if(comboOn && comboTimes.length % 3 === 0){
    showCombo('🔥 콤보 x' + comboTimes.length + '!');
  }
}
function updateCombo(){
  if(!comboOn) return;
  const now = performance.now()/1000;
  comboTimes = comboTimes.filter(t => now - t <= COMBO_WINDOW);
  if(comboTimes.length < COMBO_NEED){
    comboOn = false;
    showHint('콤보가 끝났어요. 다시 모아 보세요!', 1800);
  }
}
function showCombo(text){
  const el = $('#combo');
  el.textContent = text;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}

/* ---- 코인 획득 한 곳으로 모으기 ---- */
function gainCoins(n, noCombo){
  let amount = n;
  if(!noCombo && comboOn) amount *= 2;
  state.coins += amount;
  state.coinsEarned = (state.coinsEarned||0) + amount;
  updateHud();
  return amount;
}

/* ---- 레벨업: 화면 가득 축하 ---- */
function levelUpShow(lv){
  const box = $('#levelfx');
  const newly = UNLOCKS.filter(u => u.lv === lv);
  box.style.display = 'block';
  box.innerHTML = '<div class="flash"></div>' +
    '<div class="lvtext">레벨 ' + lv + '!' +
      '<span class="lvsub">' +
      (newly.length ? newly.map(u=>u.icon+' '+u.name+' 열림!').join('  ') : '계속 가자! 🎉') +
      '</span></div>';
  const cols = ['#ff5d5d','#ffa53d','#ffe93d','#6ee86e','#4fc3ff','#9a7dff','#ff7ddb'];
  for(let i=0;i<46;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random()*100) + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.5 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*0.7) + 's';
    c.style.width = (7 + Math.random()*9) + 'px';
    c.style.height = (10 + Math.random()*12) + 'px';
    box.appendChild(c);
  }
  clearTimeout(levelUpShow._t);
  levelUpShow._t = setTimeout(()=>{ box.style.display='none'; box.innerHTML=''; }, 3600);
}

/* ═══════════════════════════════════════════════════
   11. 화면 알림
   ═══════════════════════════════════════════════════ */
let hintTimer = null;
function showHint(text, ms){
  const el = $('#hint');
  el.textContent = text; el.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(()=>el.classList.remove('on'), ms||2000);
}
function popText(text, color){
  const el = document.createElement('div');
  el.className='pop'; el.textContent=text;
  el.style.color = color||'#fff';
  el.style.left = (50 + (Math.random()*16-8)) + '%';
  el.style.top  = '52%';
  $('#pops').appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

/* ═══════════════════════════════════════════════════
   12. 메인 루프
   ═══════════════════════════════════════════════════ */
let started = false;
let lastT = 0, fpsAcc = 0, fpsCount = 0;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function stepGame(dt){
  updateLook(dt);
  updatePlayer(dt);
  updateCamera(dt);
  updateAim();
  updateActions(dt);
  updateObby(dt);
  Collect.update(dt);
  updateCombo();
}

function frame(t){
  requestAnimationFrame(frame);
  const now = t*0.001;
  let dt = lastT ? now-lastT : 0.016;
  lastT = now;
  dt = Math.min(dt, 0.05);

  if(jumpBuffer>0) jumpBuffer -= dt;

  if(started) stepGame(dt);
  Particles.update(dt);
  sparkles.update(dt);
  if(worldDirty) rebuildWorldMesh();

  clouds.position.x += dt*0.6;
  if(clouds.position.x > 140) clouds.position.x = -140;

  fpsAcc += dt; fpsCount++;
  if(fpsAcc > 0.5){
    $('#fps').textContent = Math.round(fpsCount/fpsAcc) + ' fps · 블록 ' + visibleCount;
    fpsAcc = 0; fpsCount = 0;
  }
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════
   13. 시작!
   ═══════════════════════════════════════════════════ */
buildTextures();
buildMaterials();
loadSave();
generateWorld();
buildObbies();
applyEdits();
resize();
rebuildWorldMesh();
buildHotbar();
updateHud();
Collect.build();
refillQuests();
player.x=SPAWN.x; player.y=SPAWN.y+1; player.z=SPAWN.z;
if(SPAWN_LOAD){ player.x=SPAWN_LOAD.x; player.y=SPAWN_LOAD.y+0.5; player.z=SPAWN_LOAD.z; }
addEventListener('beforeunload', saveNow);
requestAnimationFrame(frame);

$('#startbtn').addEventListener('click', ()=>{
  $('#start').style.display='none';
  started = true;
  Sound.resume();
  canvas.focus && canvas.focus();
  showHint('화살표로 둘러보고, Q로 부수고, E로 블록을 놓아 보세요!', 5000);
  showMouseHintBriefly();
});

window.BW = {player, setBlock, getBlock, scene, camera, renderer, voxels, W,H,D, IDX, keys,
  sim(dt,n){ for(let i=0;i<(n||1);i++){ if(jumpBuffer>0) jumpBuffer-=dt; stepGame(dt); } },
  pressJump(){ jumpBuffer=0.14; },
  state, updateAim, breakBlock, placeBlock, selectSlot, addExp,
  aim(){ return aimed; }, hotbarSlot(){ return selectedSlot; },
  OBBIES, Collect, finishObby, remaining(){ return Collect.remaining(); },
  QUEST_POOL, checkQuests, refillQuests, gainCoins, hasUnlock, UNLOCKS,
  comboOn(){ return comboOn; }, registerCoinForCombo};
})();
</script>
